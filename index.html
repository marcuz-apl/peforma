<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f5f6f3"/><title>Peforma Grid — Subsurface Grid Converter</title><script>
  // Apply the saved theme before first paint. Auto mode is light from 07:00 to
  // 19:00 local time, matching the in-app theme control.
  (function () {
    var now = new Date();
    var minutes = now.getHours() * 60 + now.getMinutes();
    var theme = minutes >= 420 && minutes < 1140 ? 'light' : 'dark';
    try {
      var pref = localStorage.getItem('peforma.theme');
      if (pref === 'light' || pref === 'dark') theme = pref;
    } catch (error) { /* storage is optional */ }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#111112' : '#f5f6f3');
  })();
</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
